<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
<title>Merry Christmas</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    font-family: 'Times New Roman', Times, serif;
  }
  canvas { 
    display: block; 
    width: 100%;
    height: 100%;
  }
  .text-container {
    position: fixed;
    top: 12%;
    left: 10%;
    pointer-events: none;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .title-line1 {
    color: #fce4ec;
    font-size: clamp(20px, 4.5vw, 32px);
    font-style: italic;
    letter-spacing: 0.08em;
    text-shadow: 0 0 15px rgba(255, 105, 180, 0.6);
  }
  .title-line2 {
    color: #fce4ec;
    font-size: clamp(24px, 5.5vw, 40px);
    font-style: italic;
    letter-spacing: 0.1em;
    text-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
    padding-left: 20px;
  }
</style>
</head>
<body>
  <div class="text-container">
    <div class="title-line1">Merry Christmas</div>
    <div class="title-line2">Xuan</div>
  </div>
  <canvas id="c"></canvas>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    initParticles();
  }
  window.addEventListener('resize', resize);

  // 旋转与缩放参数
  let rotX = 0.15; // 初始俯仰角
  let rotY = 0;
  let targetRotX = 0.15;
  let targetRotY = 0;
  let zoom = 1;
  let targetZoom = 1;
  
  let dragging = false;
  let lastX = 0, lastY = 0;
  let pinchDist = null;

  const TREE_HEIGHT = 1.4;
  const TRUNK_HEIGHT = 0.3; 
  const TREE_RADIUS = 0.7;
  const TREE_COUNT = 4000;
  const GROUND_COUNT = 5000; 
  const SNOW_COUNT = 200;

  let treeParticles = [];
  let groundParticles = [];
  let snowParticles = [];

  function initParticles() {
    treeParticles = [];
    groundParticles = [];
    snowParticles = [];

    // 1. 树身 (正立圆锥)
    for (let i = 0; i < TREE_COUNT; i++) {
      const t = Math.pow(Math.random(), 0.85); // t=0底部，t=1顶部
      const y = -TREE_HEIGHT / 2 + TRUNK_HEIGHT + t * TREE_HEIGHT;
      const maxR = TREE_RADIUS * (1 - Math.pow(t, 1.2)); 
      
      // 螺旋加随机，形成蓬松感
      const angle = t * Math.PI * 25 + (Math.random() - 0.5) * 2;
      const r = maxR * Math.random();
      const x = Math.cos(angle) * r;
      const z = Math.sin(angle) * r;

      let color;
      const rand = Math.random();
      if (rand > 0.9) color = [255, 255, 255]; 
      else if (rand > 0.6) color = [255, 182, 193]; 
      else if (rand > 0.3) color = [255, 105, 180]; 
      else color = [219, 112, 147]; 

      treeParticles.push({
        x, y, z,
        size: 0.8 + Math.random() * 1.2,
        color,
        alpha: 0.5 + Math.random() * 0.5,
        twinkleSpeed: 1 + Math.random() * 2,
        phase: Math.random() * Math.PI * 2
      });
    }

    // 2. 树干
    for (let i = 0; i < 500; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = Math.random() * 0.1; 
      const x = Math.cos(angle) * r;
      const z = Math.sin(angle) * r;
      const y = -TREE_HEIGHT / 2 + Math.random() * TRUNK_HEIGHT; 

      treeParticles.push({
        x, y, z,
        size: 0.6 + Math.random() * 0.8,
        color: [180, 100, 150], 
        alpha: 0.3 + Math.random() * 0.4,
        twinkleSpeed: 0.5 + Math.random(),
        phase: Math.random() * Math.PI * 2
      });
    }

    // 3. 底部星云 (铺满底部)
    for (let i = 0; i < GROUND_COUNT; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = Math.random() * 3.5; 
      const x = Math.cos(angle) * r;
      const z = Math.sin(angle) * r;
      const y = -TREE_HEIGHT / 2 - 0.02; // 平铺在树底

      groundParticles.push({
        x, y, z,
        size: 0.5 + Math.random() * 1.5,
        color: [200 + Math.random()*55, 100 + Math.random()*80, 150 + Math.random()*80],
        alpha: 0.1 + Math.random() * 0.4,
        twinkleSpeed: 0.5 + Math.random(),
        phase: Math.random() * Math.PI * 2
      });
    }

    // 4. 雪花 (独立屏幕坐标)
    for (let i = 0; i < SNOW_COUNT; i++) {
      snowParticles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: 0.8 + Math.random() * 1.5,
        speed: 0.8 + Math.random() * 1.5, // 下落速度
        swing: Math.random() * Math.PI * 2
      });
    }
  }

  // 交互控制
  function pointerDown(e) {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
  }
  
  function pointerMove(e) {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    targetRotY += dx * 0.01;
    targetRotX += dy * 0.01;
    // 【限制视角】最高平视 (0)，最低俯视 (1.45)，绝对看不到地底下
    targetRotX = Math.max(-0.05, Math.min(1.45, targetRotX)); 
  }
  
  function pointerUp() { dragging = false; }

  canvas.addEventListener('pointerdown', pointerDown);
  window.addEventListener('pointermove', pointerMove);
  window.addEventListener('pointerup', pointerUp);
  window.addEventListener('pointercancel', pointerUp);

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    targetZoom *= e.deltaY > 0 ? 0.9 : 1.1;
    targetZoom = Math.max(0.5, Math.min(2.5, targetZoom));
  }, { passive: false });

  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      dragging = false;
      pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }
  }, { passive: true });
  
  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinchDist) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      targetZoom *= d / pinchDist;
      targetZoom = Math.max(0.5, Math.min(2.5, targetZoom));
      pinchDist = d;
    }
  }, { passive: true });
  
  canvas.addEventListener('touchend', () => { pinchDist = null; }, { passive: true });

  // 2D 屏幕投影计算 (极其稳定，不涉及复杂透视)
  function project(x, y, z, cosY, sinY, cosX, sinX) {
    // 绕 Y 轴
    let x1 = x * cosY - z * sinY;
    let z1 = x * sinY + z * cosY;
    // 绕 X 轴
    let y2 = y * cosX - z1 * sinX;

    const baseScale = Math.min(W, H) * 0.5 * zoom;
    
    return {
      sx: W / 2 + x1 * baseScale,
      sy: H * 0.55 - y2 * baseScale, 
      // 用 z1 来做简单的近大远小闪烁
      depth: z1 
    };
  }

  let time = 0;

  function frame(ts) {
    time = ts * 0.001;
    
    // 平滑插值
    if (!dragging) targetRotY += 0.002; // 自动缓慢旋转
    rotY += (targetRotY - rotY) * 0.1;
    rotX += (targetRotX - rotX) * 0.1;
    zoom += (targetZoom - zoom) * 0.1;

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
    const cosX = Math.cos(rotX), sinX = Math.sin(rotX);

    // --- 画底部星云 ---
    for (const p of groundParticles) {
      const pr = project(p.x, p.y, p.z, cosY, sinY, cosX, sinX);
      const twinkle = 0.5 + 0.5 * Math.sin(time * p.twinkleSpeed + p.phase);
      ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${p.alpha * twinkle})`;
      ctx.beginPath();
      ctx.arc(pr.sx, pr.sy, p.size, 0, Math.PI * 2);
      ctx.fill();
    }

    // --- 画树身 ---
    for (const p of treeParticles) {
      const pr = project(p.x, p.y, p.z, cosY, sinY, cosX, sinX);
      const twinkle = 0.6 + 0.4 * Math.sin(time * p.twinkleSpeed + p.phase);
      const alpha = p.alpha * twinkle;

      // 高光粒子加光晕
      if (p.color[0] === 255 && p.color[1] === 255) {
        const grad = ctx.createRadialGradient(pr.sx, pr.sy, 0, pr.sx, pr.sy, p.size * 3);
        grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
        grad.addColorStop(1, `rgba(255,255,255,0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(pr.sx, pr.sy, p.size * 3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${alpha})`;
      ctx.beginPath();
      ctx.arc(pr.sx, pr.sy, p.size, 0, Math.PI * 2);
      ctx.fill();
    }

    // --- 画树顶星星 ---
    {
      const pr = project(0, TREE_HEIGHT / 2 + TRUNK_HEIGHT + 0.1, 0, cosY, sinY, cosX, sinX);
      const pulse = 0.8 + 0.2 * Math.sin(time * 3);
      const size = 6 * pulse;
      
      const grad = ctx.createRadialGradient(pr.sx, pr.sy, 0, pr.sx, pr.sy, size * 4);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.2, 'rgba(255,182,193,0.6)');
      grad.addColorStop(1, 'rgba(255,105,180,0)');
      
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(pr.sx, pr.sy, size * 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = `rgba(255,255,255,${pulse})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(pr.sx - size * 2.5, pr.sy);
      ctx.lineTo(pr.sx + size * 2.5, pr.sy);
      ctx.moveTo(pr.sx, pr.sy - size * 2.5);
      ctx.lineTo(pr.sx, pr.sy + size * 2.5);
      ctx.stroke();
    }

    // --- 画飘雪 ---
    ctx.fillStyle = '#ffffff';
    for (const s of snowParticles) {
      s.y += s.speed; // 永远向下
      s.swing += 0.02;
      
      if (s.y > H) { 
        s.y = -10; 
        s.x = Math.random() * W; 
      }
      
      ctx.globalAlpha = s.size * 0.3;
      ctx.beginPath();
      ctx.arc(s.x + Math.sin(s.swing) * 20, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
