<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Merry Christmas to Xuan</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #2a0a1c 0%, #12040c 60%, #000 100%);
    font-family: 'Georgia', serif;
  }
  canvas { display: block; }
  .title {
    position: fixed;
    left: 50%;
    top: 36px;
    transform: translateX(-50%);
    color: #ffd6e8;
    font-size: clamp(20px, 4vw, 32px);
    letter-spacing: .12em;
    text-shadow: 0 0 20px rgba(255, 105, 180, 0.8), 0 0 40px rgba(255, 20, 147, 0.4);
    user-select: none;
    pointer-events: none;
    white-space: nowrap;
    font-style: italic;
  }
</style>
</head>
<body>
<div class="title">Merry Christmas to Xuan</div>
<canvas id="c"></canvas>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- 粉色系粒子生成 ----------
  const TREE_HEIGHT = 1.9;
  const TREE_RADIUS = 0.75;
  const COUNT = 2600;

  const particles = [];
  for (let i = 0; i < COUNT; i++) {
    const t = Math.pow(Math.random(), 0.75);
    const y = (t - 0.5) * TREE_HEIGHT;
    const maxR = TREE_RADIUS * (1 - t);
    const spiral = t * Math.PI * 14;
    const angle = spiral + Math.random() * Math.PI * 2;
    const r = maxR * (0.35 + 0.65 * Math.random());
    const x = Math.cos(angle) * r;
    const z = Math.sin(angle) * r;

    // 粉色系配色：深粉、樱花粉、亮粉、香槟金
    let color;
    const rnd = Math.random();
    if (rnd < 0.08) {
      color = [255, 230, 180];   // 香槟金点缀
    } else if (rnd < 0.15) {
      color = [255, 255, 255];   // 纯白闪光
    } else {
      const g = 80 + Math.floor(130 * t);
      const b = 130 + Math.floor(80 * t);
      color = [255, g, b];       // 从玫红到亮粉渐变
    }

    particles.push({
      x, y, z,
      size: 0.8 + Math.random() * 1.6,
      color,
      phase: Math.random() * Math.PI * 2,
      speed: 0.6 + Math.random() * 1.4,
      baseAlpha: 0.45 + Math.random() * 0.55
    });
  }

  const star = { x: 0, y: -TREE_HEIGHT / 2 - 0.12, z: 0, phase: 0 };

  // 背景星光
  const bgStars = [];
  for (let i = 0; i < 260; i++) {
    bgStars.push({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.3 + 0.3,
      a: Math.random() * 0.6 + 0.2,
      tw: Math.random() * Math.PI * 2
    });
  }

  // ---------- 交互 ----------
  let rotY = 0.5;
  let rotX = -0.18;
  let zoom = 1;
  let dragging = false;
  let lastX = 0, lastY = 0;

  function pointerDown(e) {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
  }
  function pointerMove(e) {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    rotY += dx * 0.008;
    rotX += dy * 0.006;
    rotX = Math.max(-0.9, Math.min(0.9, rotX));
  }
  function pointerUp() { dragging = false; }

  canvas.addEventListener('pointerdown', pointerDown);
  window.addEventListener('pointermove', pointerMove);
  window.addEventListener('pointerup', pointerUp);
  window.addEventListener('pointercancel', pointerUp);

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoom *= e.deltaY > 0 ? 0.92 : 1.08;
    zoom = Math.max(0.45, Math.min(2.2, zoom));
  }, { passive: false });

  let pinchDist = null;
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      pinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinchDist) {
      const d = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      zoom *= d / pinchDist;
      zoom = Math.max(0.45, Math.min(2.2, zoom));
      pinchDist = d;
    }
  }, { passive: true });
  canvas.addEventListener('touchend', () => { pinchDist = null; }, { passive: true });

  // ---------- 渲染 ----------
  function project(p, cosY, sinY, cosX, sinX) {
    let x = p.x * cosY - p.z * sinY;
    let z = p.x * sinY + p.z * cosY;
    let y = p.y * cosX - z * sinX;
    z = p.y * sinX + z * cosX;

    const scale = Math.min(W, H) * 0.42 * zoom;
    const persp = 1 / (1 - z * 0.35);
    return {
      sx: W / 2 + x * scale * persp,
      sy: H / 2 + y * scale * persp,
      depth: z,
      persp
    };
  }

  let time = 0;
  function frame(ts) {
    time = ts * 0.001;
    ctx.clearRect(0, 0, W, H);

    // 背景星光
    for (const s of bgStars) {
      const tw = 0.6 + 0.4 * Math.sin(time * 1.5 + s.tw);
      ctx.globalAlpha = s.a * tw;
      ctx.fillStyle = '#ffd1e8';
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
    const cosX = Math.cos(rotX), sinX = Math.sin(rotX);

    const list = particles.map(p => {
      const pr = project(p, cosY, sinY, cosX, sinX);
      return { p, pr };
    }).sort((a, b) => a.pr.depth - b.pr.depth);

    for (const { p, pr } of list) {
      const twinkle = 0.65 + 0.35 * Math.sin(time * p.speed + p.phase);
      const alpha = p.baseAlpha * twinkle * (0.55 + 0.45 * pr.persp);
      const [r, g, b] = p.color;
      const rad = p.size * pr.persp;

      const grad = ctx.createRadialGradient(pr.sx, pr.sy, 0, pr.sx, pr.sy, rad * 3.2);
      grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(pr.sx, pr.sy, rad * 3.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `rgba(${r},${g},${b},${Math.min(1, alpha * 1.6)})`;
      ctx.beginPath();
      ctx.arc(pr.sx, pr.sy, Math.max(0.4, rad), 0, Math.PI * 2);
      ctx.fill();
    }

    // 树顶星星
    {
      const pr = project(star, cosY, sinY, cosX, sinX);
      const pulse = 0.7 + 0.3 * Math.sin(time * 2.4);
      const size = 9 * pr.persp * pulse * zoom;
      const grad = ctx.createRadialGradient(pr.sx, pr.sy, 0, pr.sx, pr.sy, size * 2.6);
      grad.addColorStop(0, 'rgba(255,255,255,0.95)');
      grad.addColorStop(0.35, 'rgba(255,105,180,0.6)');
      grad.addColorStop(1, 'rgba(255,20,147,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(pr.sx, pr.sy, size * 2.6, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = `rgba(255,200,220,${0.8 * pulse})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(pr.sx - size * 1.6, pr.sy);
      ctx.lineTo(pr.sx + size * 1.6, pr.sy);
      ctx.moveTo(pr.sx, pr.sy - size * 1.6);
      ctx.lineTo(pr.sx, pr.sy + size * 1.6);
      ctx.stroke();
    }

    if (!dragging) rotY += 0.0016;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
