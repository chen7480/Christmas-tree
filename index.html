<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
<title>Merry Christmas to Xuan</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    font-family: 'Times New Roman', Times, serif; /* 使用经典衬线字体 */
  }
  canvas { 
    display: block; 
    width: 100%;
    height: 100%;
  }
  .text-container {
    position: fixed;
    top: 12%;
    left: 8%;
    pointer-events: none;
    z-index: 10;
  }
  .title {
    color: #e0e0e0;
    font-size: clamp(24px, 5vw, 40px);
    font-style: italic;
    letter-spacing: 0.05em;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
  }
</style>
</head>
<body>
  <div class="text-container">
    <div class="title">Merry Christmas</div>
  </div>
  <canvas id="c"></canvas>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    initParticles(); // 窗口大小改变时重新计算粒子位置
  }
  window.addEventListener('resize', resize);

  // ---------- 参数设置 ----------
  let rotX = 0.3; // 初始俯视角度
  let rotY = 0;
  let targetRotX = 0.3;
  let targetRotY = 0;
  let zoom = 1;
  let targetZoom = 1;
  
  let dragging = false;
  let lastX = 0, lastY = 0;
  let pinchDist = null;

  const TREE_HEIGHT = 1.6;
  const TREE_RADIUS = 0.6;
  const TREE_COUNT = 3000;
  const GROUND_COUNT = 3000;
  const SNOW_COUNT = 300;

  let treeParticles = [];
  let groundParticles = [];
  let snowParticles = [];

  // ---------- 初始化粒子 ----------
  function initParticles() {
    treeParticles = [];
    groundParticles = [];
    snowParticles = [];

    // 1. 树身粒子 (完美螺旋圆锥)
    for (let i = 0; i < TREE_COUNT; i++) {
      // t: 0 底部 -> 1 顶部 (使用幂函数让底部更密)
      const t = Math.pow(Math.random(), 0.8);
      const y = TREE_HEIGHT / 2 - t * TREE_HEIGHT; // Y轴向上为正，顶部Y小，底部Y大
      const maxR = TREE_RADIUS * (1 - t);
      
      // 螺旋线 + 随机散布
      const spiralAngle = t * Math.PI * 20; 
      const angle = spiralAngle + (Math.random() - 0.5) * 1.5;
      const r = maxR * (0.8 + Math.random() * 0.2);
      
      const x = Math.cos(angle) * r;
      const z = Math.sin(angle) * r;

      // 颜色：冷白、微蓝、高亮白
      const colorType = Math.random();
      let color;
      if (colorType > 0.95) color = [255, 255, 255]; // 极亮白点
      else if (colorType > 0.7) color = [180, 200, 255]; // 偏蓝
      else color = [140, 160, 210]; // 灰蓝

      treeParticles.push({
        x, y, z,
        size: 0.6 + Math.random() * 1.2,
        color,
        alpha: 0.4 + Math.random() * 0.6,
        twinkleSpeed: 1 + Math.random() * 2,
        phase: Math.random() * Math.PI * 2
      });
    }

    // 2. 底部星云粒子
    for (let i = 0; i < GROUND_COUNT; i++) {
      const angle = Math.random() * Math.PI * 2;
      // 用正态分布让中间密，边缘稀疏
      const r = Math.abs(Math.random() + Math.random() + Math.random() - 1.5) * 2.5;
      const x = Math.cos(angle) * r;
      const z = Math.sin(angle) * r;
      const y = -TREE_HEIGHT / 2 - Math.random() * 0.1; // 在树底下方

      groundParticles.push({
        x, y, z,
        size: 0.4 + Math.random() * 1.0,
        color: [100 + Math.random()*50, 110 + Math.random()*50, 150 + Math.random()*50],
        alpha: 0.1 + Math.random() * 0.5,
        twinkleSpeed: 0.5 + Math.random(),
        phase: Math.random() * Math.PI * 2
      });
    }

    // 3. 背景雪花
    for (let i = 0; i < SNOW_COUNT; i++) {
      snowParticles.push({
        x: (Math.random() - 0.5) * 15,
        y: Math.random() * 12,
        z: (Math.random() - 0.5) * 15,
        size: 0.5 + Math.random() * 1.5,
        speed: 0.01 + Math.random() * 0.03,
        swing: Math.random() * Math.PI * 2
      });
    }
  }

  // ---------- 交互控制 (360度无死角) ----------
  function pointerDown(e) {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    targetRotY = rotY;
    targetRotX = rotX;
  }
  
  function pointerMove(e) {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    // 允许无限旋转，随便转
    targetRotY += dx * 0.01;
    targetRotX += dy * 0.01;
  }
  
  function pointerUp() { dragging = false; }

  canvas.addEventListener('pointerdown', pointerDown);
  window.addEventListener('pointermove', pointerMove);
  window.addEventListener('pointerup', pointerUp);
  window.addEventListener('pointercancel', pointerUp);

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    targetZoom *= e.deltaY > 0 ? 0.9 : 1.1;
    targetZoom = Math.max(0.3, Math.min(3, targetZoom));
  }, { passive: false });

  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      dragging = false;
      pinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinchDist) {
      const d = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      targetZoom *= d / pinchDist;
      targetZoom = Math.max(0.3, Math.min(3, targetZoom));
      pinchDist = d;
    }
  }, { passive: true });

  canvas.addEventListener('touchend', () => { pinchDist = null; }, { passive: true });

  // ---------- 3D 投影计算 ----------
  function project(x, y, z, cosY, sinY, cosX, sinX) {
    // 1. 绕 Y 轴旋转
    let x1 = x * cosY - z * sinY;
    let z1 = x * sinY + z * cosY;
    
    // 2. 绕 X 轴旋转
    let y2 = y * cosX - z1 * sinX;
    let z2 = y * sinX + z1 * cosX;

    // 3. 透视投影
    const fov = 800 * zoom;
    const scale = fov / (fov + z2 * 300);
    
    // 屏幕中心稍微往下移一点，让树在屏幕中间
    const centerY = H * 0.55; 
    
    return {
      sx: W / 2 + x1 * scale * Math.min(W, H) * 0.7,
      sy: centerY - y2 * scale * Math.min(W, H) * 0.7,
      depth: z2,
      scale
    };
  }

  let time = 0;

  function frame(ts) {
    time = ts * 0.001;
    
    // 平滑动画过渡
    if (!dragging) {
      targetRotY += 0.002; // 自动缓慢自转
    }
    rotY += (targetRotY - rotY) * 0.1;
    rotX += (targetRotX - rotX) * 0.1;
    zoom += (targetZoom - zoom) * 0.1;

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
    const cosX = Math.cos(rotX), sinX = Math.sin(rotX);

    // --- 绘制底部星云 ---
    // 星云不需要太严格的深度排序，直接画
    for (const p of groundParticles) {
      const pr = project(p.x, p.y, p.z, cosY, sinY, cosX, sinX);
      const twinkle = 0.5 + 0.5 * Math.sin(time * p.twinkleSpeed + p.phase);
      const alpha = p.alpha * twinkle * pr.scale;
      const [r, g, b] = p.color;
      
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.beginPath();
      ctx.arc(pr.sx, pr.sy, p.size * pr.scale, 0, Math.PI * 2);
      ctx.fill();
    }

    // --- 绘制树身 ---
    // 按深度排序，远的先画，近的后画
    const sortedTree = treeParticles.map(p => {
      return { p, pr: project(p.x, p.y, p.z, cosY, sinY, cosX, sinX) };
    }).sort((a, b) => a.pr.depth - b.pr.depth);

    for (const { p, pr } of sortedTree) {
      const twinkle = 0.6 + 0.4 * Math.sin(time * p.twinkleSpeed + p.phase);
      const alpha = p.alpha * twinkle * pr.scale;
      const [r, g, b] = p.color;
      const rad = p.size * pr.scale;

      // 偶尔给亮色粒子加光晕
      if (r === 255) {
        const grad = ctx.createRadialGradient(pr.sx, pr.sy, 0, pr.sx, pr.sy, rad * 3);
        grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
        grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(pr.sx, pr.sy, rad * 3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.beginPath();
      ctx.arc(pr.sx, pr.sy, Math.max(0.5, rad), 0, Math.PI * 2);
      ctx.fill();
    }

    // --- 绘制树顶星星 ---
    {
      const pr = project(0, TREE_HEIGHT / 2 + 0.1, 0, cosY, sinY, cosX, sinX);
      const pulse = 0.8 + 0.2 * Math.sin(time * 3);
      const size = 6 * pr.scale * pulse;
      
      const grad = ctx.createRadialGradient(pr.sx, pr.sy, 0, pr.sx, pr.sy, size * 4);
      grad.addColorStop(0, 'rgba(255,255,255,0.9)');
      grad.addColorStop(0.2, 'rgba(200,220,255,0.6)');
      grad.addColorStop(1, 'rgba(150,180,255,0)');
      
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(pr.sx, pr.sy, size * 4, 0, Math.PI * 2);
      ctx.fill();

      // 十字星芒
      ctx.strokeStyle = `rgba(255,255,255,${pulse})`;
      ctx.lineWidth = 1 * pr.scale;
      ctx.beginPath();
      ctx.moveTo(pr.sx - size * 2.5, pr.sy);
      ctx.lineTo(pr.sx + size * 2.5, pr.sy);
      ctx.moveTo(pr.sx, pr.sy - size * 2.5);
      ctx.lineTo(pr.sx, pr.sy + size * 2.5);
      ctx.stroke();
    }

    // --- 绘制飘雪 (2D覆盖在最上层) ---
    ctx.fillStyle = '#ffffff';
    for (const s of snowParticles) {
      // 雪花不受3D旋转影响，单独做2D下落
      s.y -= s.speed;
      s.swing += 0.01;
      const sx = (s.x + Math.sin(s.swing) * 0.5) * (W / 10) + W / 2;
      const sy = (s.y) * (H / 10);
      
      // 循环回顶
      if (s.y < -2) s.y = 10;
      
      ctx.globalAlpha = s.size * 0.4;
      ctx.beginPath();
      ctx.arc(sx, sy, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    requestAnimationFrame(frame);
  }

  // 启动
  initParticles();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
