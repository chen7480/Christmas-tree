<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
<title>Merry Christmas</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    font-family: 'Times New Roman', Times, serif;
  }
  canvas { 
    display: block; 
    width: 100%;
    height: 100%;
  }
  .text-container {
    position: fixed;
    top: 15%;
    left: 10%;
    pointer-events: none;
    z-index: 10;
  }
  .title {
    color: #e0e0e0;
    font-size: clamp(24px, 5vw, 40px);
    font-style: italic;
    letter-spacing: 0.05em;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
  }
</style>
</head>
<body>
  <div class="text-container">
    <div class="title">Merry Christmas</div>
  </div>
  <canvas id="c"></canvas>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    initParticles();
  }
  window.addEventListener('resize', resize);

  // 状态变量
  let rotX = 0.2; 
  let rotY = 0;
  let targetRotX = 0.2;
  let targetRotY = 0;
  let zoom = 1;
  let targetZoom = 1;
  
  let dragging = false;
  let lastX = 0, lastY = 0;
  let pinchDist = null;

  const TREE_HEIGHT = 1.4;
  const TREE_RADIUS = 0.7;
  const TREE_COUNT = 3500;
  const GROUND_COUNT = 4000;
  const SNOW_COUNT = 200;

  let treeParticles = [];
  let groundParticles = [];
  let snowParticles = [];

  function initParticles() {
    treeParticles = [];
    groundParticles = [];
    snowParticles = [];

    // 1. 树身粒子
    for (let i = 0; i < TREE_COUNT; i++) {
      const t = Math.pow(Math.random(), 0.8);
      const y = TREE_HEIGHT / 2 - t * TREE_HEIGHT;
      const maxR = TREE_RADIUS * (1 - t);
      
      const spiralAngle = t * Math.PI * 22; 
      const angle = spiralAngle + (Math.random() - 0.5) * 2;
      const r = maxR * Math.random(); // 内部也有粒子，更饱满
      
      const x = Math.cos(angle) * r;
      const z = Math.sin(angle) * r;

      // 颜色：冷白、微蓝
      let color;
      if (Math.random() > 0.8) color = [255, 255, 255]; 
      else if (Math.random() > 0.5) color = [180, 200, 255]; 
      else color = [120, 140, 200]; 

      treeParticles.push({
        x, y, z,
        size: 0.8 + Math.random() * 1.2,
        color,
        alpha: 0.5 + Math.random() * 0.5,
        twinkleSpeed: 1 + Math.random() * 2,
        phase: Math.random() * Math.PI * 2
      });
    }

    // 2. 底部星云
    for (let i = 0; i < GROUND_COUNT; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = Math.random() * 2.0;
      const x = Math.cos(angle) * r;
      const z = Math.sin(angle) * r;
      const y = -TREE_HEIGHT / 2 - (Math.random() * 0.05);

      groundParticles.push({
        x, y, z,
        size: 0.5 + Math.random() * 1.2,
        color: [100 + Math.random()*50, 110 + Math.random()*50, 150 + Math.random()*50],
        alpha: 0.2 + Math.random() * 0.6,
        twinkleSpeed: 0.5 + Math.random(),
        phase: Math.random() * Math.PI * 2
      });
    }

    // 3. 背景雪花
    for (let i = 0; i < SNOW_COUNT; i++) {
      snowParticles.push({
        x: (Math.random() - 0.5) * 2,
        y: Math.random() * 2,
        size: 0.8 + Math.random() * 1.5,
        speed: 0.002 + Math.random() * 0.005,
        swing: Math.random() * Math.PI * 2
      });
    }
  }

  // 交互
  function pointerDown(e) {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
  }
  function pointerMove(e) {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    targetRotY += dx * 0.01;
    targetRotX += dy * 0.01;
    // 限制X轴翻转不超过180度防止倒过来看着晕
    targetRotX = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, targetRotX));
  }
  function pointerUp() { dragging = false; }

  canvas.addEventListener('pointerdown', pointerDown);
  window.addEventListener('pointermove', pointerMove);
  window.addEventListener('pointerup', pointerUp);
  window.addEventListener('pointercancel', pointerUp);

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    targetZoom *= e.deltaY > 0 ? 0.9 : 1.1;
    targetZoom = Math.max(0.5, Math.min(2.5, targetZoom));
  }, { passive: false });

  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      dragging = false;
      pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinchDist) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      targetZoom *= d / pinchDist;
      targetZoom = Math.max(0.5, Math.min(2.5, targetZoom));
      pinchDist = d;
    }
  }, { passive: true });
  canvas.addEventListener('touchend', () => { pinchDist = null; }, { passive: true });

  // 安全的3D投影
  function project(x, y, z, cosY, sinY, cosX, sinX) {
    let x1 = x * cosY - z * sinY;
    let z1 = x * sinY + z * cosY;
    let y2 = y * cosX - z1 * sinX;
    let z2 = y * sinX + z1 * cosX;

    // 这里用最稳妥的缩放法，绝对不会除以0
    const baseScale = Math.min(W, H) * 0.5 * zoom;
    // 伪透视：根据深度稍微缩放一点
    const persp = 1 - z2 * 0.3; 
    
    return {
      sx: W / 2 + x1 * baseScale * persp,
      sy: H * 0.6 - y2 * baseScale * persp,
      depth: z2,
      scale: persp
    };
  }

  let time = 0;

  function frame(ts) {
    time = ts * 0.001;
    
    if (!dragging) targetRotY += 0.003; // 自动旋转
    rotY += (targetRotY - rotY) * 0.1;
    rotX += (targetRotX - rotX) * 0.1;
    zoom += (targetZoom - zoom) * 0.1;

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
    const cosX = Math.cos(rotX), sinX = Math.sin(rotX);

    // 底部星云
    for (const p of groundParticles) {
      const pr = project(p.x, p.y, p.z, cosY, sinY, cosX, sinX);
      const twinkle = 0.5 + 0.5 * Math.sin(time * p.twinkleSpeed + p.phase);
      const alpha = p.alpha * twinkle;
      ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${alpha})`;
      ctx.beginPath();
      ctx.arc(pr.sx, pr.sy, p.size * pr.scale, 0, Math.PI * 2);
      ctx.fill();
    }

    // 树身
    const sortedTree = treeParticles.map(p => {
      return { p, pr: project(p.x, p.y, p.z, cosY, sinY, cosX, sinX) };
    }).sort((a, b) => a.pr.depth - b.pr.depth);

    for (const { p, pr } of sortedTree) {
      const twinkle = 0.6 + 0.4 * Math.sin(time * p.twinkleSpeed + p.phase);
      const alpha = p.alpha * twinkle;
      const rad = p.size * pr.scale;

      if (p.color[0] === 255) {
        const grad = ctx.createRadialGradient(pr.sx, pr.sy, 0, pr.sx, pr.sy, rad * 3);
        grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
        grad.addColorStop(1, `rgba(255,255,255,0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(pr.sx, pr.sy, rad * 3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${alpha})`;
      ctx.beginPath();
      ctx.arc(pr.sx, pr.sy, Math.max(0.5, rad), 0, Math.PI * 2);
      ctx.fill();
    }

    // 树顶星星
    {
      const pr = project(0, TREE_HEIGHT / 2 + 0.1, 0, cosY, sinY, cosX, sinX);
      const pulse = 0.8 + 0.2 * Math.sin(time * 3);
      const size = 6 * pr.scale * pulse;
      
      const grad = ctx.createRadialGradient(pr.sx, pr.sy, 0, pr.sx, pr.sy, size * 4);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.2, 'rgba(200,220,255,0.6)');
      grad.addColorStop(1, 'rgba(150,180,255,0)');
      
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(pr.sx, pr.sy, size * 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = `rgba(255,255,255,${pulse})`;
      ctx.lineWidth = 1.5 * pr.scale;
      ctx.beginPath();
      ctx.moveTo(pr.sx - size * 2.5, pr.sy);
      ctx.lineTo(pr.sx + size * 2.5, pr.sy);
      ctx.moveTo(pr.sx, pr.sy - size * 2.5);
      ctx.lineTo(pr.sx, pr.sy + size * 2.5);
      ctx.stroke();
    }

    // 飘雪
    ctx.fillStyle = '#ffffff';
    for (const s of snowParticles) {
      s.y -= s.speed;
      s.swing += 0.02;
      const sx = W / 2 + (s.x + Math.sin(s.swing) * 0.1) * W;
      const sy = s.y * H;
      if (s.y < 0) s.y = 1;
      
      ctx.globalAlpha = s.size * 0.3;
      ctx.beginPath();
      ctx.arc(sx, sy, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
