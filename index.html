<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
<title>Merry Christmas</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    font-family: 'Times New Roman', Times, serif;
    overscroll-behavior: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;
  let gradCache = {};
  let starGradCache = null;

  function resize() {
    gradCache = {};
    starGradCache = null;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    initParticles();
  }
  window.addEventListener('resize', resize);

  // 视角控制
  let angleY = 0;
  const speedY = 0.005;
  let scale = 1;
  let targetScale = 1;
  let dragging = false;
  let lastX = 0;

  const TREE_COUNT = 2500;
  const GROUND_COUNT = 3000;
  const SNOW_COUNT = 150;

  let treeParticles = [];
  let groundParticles = [];
  let snowParticles = [];

  function initParticles() {
    treeParticles = [];
    groundParticles = [];
    snowParticles = [];
    const treeBaseY = H * 0.8;
    const treeHeight = H * 0.55;
    const maxRadius = W * 0.4;

    // 树身粒子
    for (let i = 0; i < TREE_COUNT; i++) {
      const t = Math.pow(Math.random(), 0.6);
      const y = treeBaseY - t * treeHeight;
      let radius = 0;
      if (t > 0.15) {
        radius = maxRadius * (1 - Math.pow(t, 1.2));
      }
      const r = Math.random() * radius;
      const a = Math.random() * Math.PI * 2;
      let color;
      const rand = Math.random();
      if (rand > 0.92) color = '#ffffff';
      else if (rand > 0.7) color = '#ffb6c1';
      else if (rand > 0.4) color = '#ff69b4';
      else color = '#db7093';
      treeParticles.push({
        localY: y,
        localX: Math.cos(a) * r,
        localZ: Math.sin(a) * r,
        size: 0.6 + Math.random() * 1.5,
        color: color,
        alpha: 0.4 + Math.random() * 0.6,
        twinkleSpeed: 1 + Math.random() * 3,
        phase: Math.random() * Math.PI * 2
      });
    }

    // 底部星云
    for (let i = 0; i < GROUND_COUNT; i++) {
      const r = Math.random() * maxRadius * 2.5;
      const a = Math.random() * Math.PI * 2;
      let alpha = (1 - r / (maxRadius * 2.5)) * 0.6;
      groundParticles.push({
        localY: treeBaseY + Math.random() * 30 - 15,
        localX: Math.cos(a) * r,
        localZ: Math.sin(a) * r,
        size: 0.5 + Math.random() * 1.5,
        color: Math.random() > 0.5 ? '#ff69b4' : '#db7093',
        alpha: alpha,
        twinkleSpeed: 0.5 + Math.random(),
        phase: Math.random() * Math.PI * 2
      });
    }

    // 雪花
    for (let i = 0; i < SNOW_COUNT; i++) {
      snowParticles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: 0.8 + Math.random() * 1.5,
        speed: 0.8 + Math.random() * 1.5,
        swing: Math.random() * Math.PI * 2
      });
    }
  }

  // 手势与拖拽控制
  let pointerCache = new Map();
  let lastPinchDist = 0;

  canvas.addEventListener('pointerdown', e => {
    pointerCache.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (pointerCache.size === 1) {
      dragging = true;
      lastX = e.clientX;
    }
  });

  canvas.addEventListener('pointermove', e => {
    if (!pointerCache.has(e.pointerId)) return;
    pointerCache.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (pointerCache.size === 2) {
      dragging = false;
      const pts = Array.from(pointerCache.values());
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (lastPinchDist > 0) {
        targetScale *= d / lastPinchDist;
        targetScale = Math.max(0.5, Math.min(2.5, targetScale));
      }
      lastPinchDist = d;
    } else if (pointerCache.size === 1 && dragging) {
      const dx = e.clientX - lastX;
      lastX = e.clientX;
      angleY += dx * 0.015;
    }
  });

  function removePointer(e) {
    pointerCache.delete(e.pointerId);
    if (pointerCache.size < 2) lastPinchDist = 0;
    if (pointerCache.size === 0) dragging = false;
  }
  window.addEventListener('pointerup', removePointer);
  window.addEventListener('pointercancel', removePointer);

  // 滚轮缩放
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    targetScale *= e.deltaY > 0 ? 0.9 : 1.1;
    targetScale = Math.max(0.5, Math.min(2.5, targetScale));
  }, { passive: false });

  let time = 0;
  function frame(ts) {
    time = (ts * 0.001) % (Math.PI * 100);
    if (!dragging) angleY += speedY;
    scale += (targetScale - scale) * 0.1;

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    const cosY = Math.cos(angleY);
    const sinY = Math.sin(angleY);
    const centerY = H * 0.55;

    // 绘制底部星云
    for (const p of groundParticles) {
      const x = p.localX * cosY - p.localZ * sinY;
      const z = p.localX * sinY + p.localZ * cosY;
      const persp = Math.max(0.3, (z + 1000) / 1000);
      const finalX = W / 2 + x * scale;
      const finalY = centerY + (p.localY - centerY) * scale;
      const twinkle = 0.5 + 0.5 * Math.sin(time * p.twinkleSpeed + p.phase);

      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.alpha * twinkle * persp;
      ctx.beginPath();
      ctx.arc(finalX, finalY, p.size * scale * persp, 0, Math.PI * 2);
      ctx.fill();
    }

    // 绘制树身粒子
    for (const p of treeParticles) {
      const x = p.localX * cosY - p.localZ * sinY;
      const z = p.localX * sinY + p.localZ * cosY;
      const persp = Math.max(0.3, (z + 1000) / 1000);
      const finalX = W / 2 + x * scale;
      const finalY = centerY + (p.localY - centerY) * scale;
      const twinkle = 0.6 + 0.4 * Math.sin(time * p.twinkleSpeed + p.phase);
      const alpha = Math.max(0, p.alpha * twinkle * persp);

      if ((p.color === '#ffffff' || p.color === '#ffb6c1')) {
        const rad = p.size * 3 * scale * persp;
        const key = p.color + "|" + rad.toFixed(1);
        let grad = gradCache[key];
        if (!grad) {
          grad = ctx.createRadialGradient(0,0,0,0,0,rad);
          const rgb = p.color === '#ffffff' ? '255,255,255' : '255,182,193';
          grad.addColorStop(0, `rgba(${rgb},1)`);
          grad.addColorStop(1, `rgba(${rgb},0)`);
          gradCache[key] = grad;
        }
        ctx.save();
        ctx.translate(finalX, finalY);
        ctx.fillStyle = grad;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(0, 0, rad, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.fillStyle = p.color;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(finalX, finalY, p.size * scale * persp, 0, Math.PI * 2);
      ctx.fill();
    }

    // 树顶星星【修复光晕坐标偏移】
    {
      const starY = H * 0.8 - H * 0.55 - (H * 0.04);
      const finalY = centerY + (starY - centerY) * scale;
      const finalX = W / 2;
      const pulse = 0.8 + 0.2 * Math.sin(time * 3);
      const size = 6 * pulse * scale;
      const starRadius = size * 4;

      if(!starGradCache || starGradCache.radius !== starRadius){
        starGradCache = {
          radius: starRadius,
          grad: ctx.createRadialGradient(0,0,0,0,0, starRadius)
        };
        starGradCache.grad.addColorStop(0, 'rgba(255,255,255,1)');
        starGradCache.grad.addColorStop(0.2, 'rgba(255,182,193,0.6)');
        starGradCache.grad.addColorStop(1, 'rgba(255,105,180,0)');
      }

      ctx.save();
      ctx.translate(finalX, finalY);
      ctx.fillStyle = starGradCache.grad;
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(0, 0, starRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.strokeStyle = `rgba(255,255,255,${pulse})`;
      ctx.lineWidth = 1.5 * scale;
      ctx.beginPath();
      ctx.moveTo(finalX - size * 2.5, finalY);
      ctx.lineTo(finalX + size * 2.5, finalY);
      ctx.moveTo(finalX, finalY - size * 2.5);
      ctx.lineTo(finalX, finalY + size * 2.5);
      ctx.stroke();
    }

    // 雪花
    ctx.fillStyle = '#ffffff';
    for (const s of snowParticles) {
      s.y += s.speed * scale;
      s.swing += 0.02;
      if (s.y > H) {
        s.y = -10 * scale;
        s.x = Math.random() * W;
      }
      ctx.globalAlpha = s.size * 0.3;
      ctx.beginPath();
      ctx.arc(s.x + Math.sin(s.swing) * 20 * scale, s.y, s.size * scale, 0, Math.PI * 2);
      ctx.fill();
    }

    // 绘制文字
    ctx.globalAlpha = 1;
    ctx.font = `italic ${Math.max(20, 32 * scale)}px 'Times New Roman', serif`;
    ctx.fillStyle = "#fce4ec";
    ctx.shadowColor = "rgba(255,105,180,0.6)";
    ctx.shadowBlur = 15 * scale;
    ctx.fillText("Merry Christmas", W * 0.1, H * 0.12);

    ctx.font = `italic ${Math.max(24, 40 * scale)}px 'Times New Roman', serif`;
    ctx.shadowBlur = 20 * scale;
    ctx.fillText("Xuan", W * 0.1 + 20 * scale, H * 0.12 + 40 * scale);
    ctx.shadowBlur = 0;

    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
