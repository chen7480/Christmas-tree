<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
<title>Merry Christmas</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    font-family: 'Times New Roman', Times, serif;
  }
  canvas { 
    display: block; 
    width: 100%;
    height: 100%;
  }
  .text-container {
    position: fixed;
    top: 12%;
    left: 10%;
    pointer-events: none;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .title-line1 {
    color: #fce4ec;
    font-size: clamp(20px, 4.5vw, 32px);
    font-style: italic;
    letter-spacing: 0.08em;
    text-shadow: 0 0 15px rgba(255, 105, 180, 0.6);
  }
  .title-line2 {
    color: #fce4ec;
    font-size: clamp(24px, 5.5vw, 40px);
    font-style: italic;
    letter-spacing: 0.1em;
    text-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
    padding-left: 20px;
  }
</style>
</head>
<body>
  <div class="text-container">
    <div class="title-line1">Merry Christmas</div>
    <div class="title-line2">Xuan</div>
  </div>
  <canvas id="c"></canvas>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    initParticles();
  }
  window.addEventListener('resize', resize);

  // 纯 2D 交互参数
  let angleY = 0;
  let speedY = 0.008;
  let scale = 1;
  let targetScale = 1;

  let dragging = false;
  let lastX = 0;

  const TREE_COUNT = 1500;
  const GROUND_COUNT = 3000;
  const SNOW_COUNT = 150;

  let treeParticles = [];
  let groundParticles = [];
  let snowParticles = [];

  function initParticles() {
    treeParticles = [];
    groundParticles = [];
    snowParticles = [];

    const treeBaseY = H * 0.8; // 树根在屏幕的 80% 位置
    const treeHeight = H * 0.5;
    const maxRadius = W * 0.35;

    // 1. 生成 2D 树身
    for (let i = 0; i < TREE_COUNT; i++) {
      const t = Math.pow(Math.random(), 0.7); // 底部密，顶部疏
      const y = treeBaseY - t * treeHeight;
      
      // 树干底座 20% 是树干，不加宽
      let radius = 0;
      if (t > 0.15) {
         radius = maxRadius * (1 - t);
      }

      // 给粒子在半径内一个随机位置
      const r = Math.random() * radius;
      const a = Math.random() * Math.PI * 2;

      // 高级冷调粉色
      let color;
      const rand = Math.random();
      if (rand > 0.95) color = '#ffffff'; 
      else if (rand > 0.7) color = '#ffb6c1'; 
      else if (rand > 0.4) color = '#ff69b4'; 
      else color = '#db7093'; 

      treeParticles.push({
        localY: y,
        localX: Math.cos(a) * r,
        localZ: Math.sin(a) * r, // 用 Z 来做 2D 的缩放和透明度模拟
        size: 0.5 + Math.random() * 1.5,
        color: color,
        alpha: 0.4 + Math.random() * 0.6,
        twinkleSpeed: 1 + Math.random() * 3,
        phase: Math.random() * Math.PI * 2
      });
    }

    // 2. 底部星云
    for (let i = 0; i < GROUND_COUNT; i++) {
      const r = Math.random() * maxRadius * 2.5; // 铺满全屏
      const a = Math.random() * Math.PI * 2;
      
      // 越靠外越淡，保证中间树根明显
      let alpha = (1 - r / (maxRadius * 2.5)) * 0.6;
      
      groundParticles.push({
        localY: treeBaseY + Math.random() * 20 - 10, // 在树根附近散布
        localX: Math.cos(a) * r,
        localZ: Math.sin(a) * r,
        size: 0.5 + Math.random() * 1.5,
        color: Math.random() > 0.5 ? '#ff69b4' : '#db7093',
        alpha: alpha,
        twinkleSpeed: 0.5 + Math.random(),
        phase: Math.random() * Math.PI * 2
      });
    }

    // 3. 雪花
    for (let i = 0; i < SNOW_COUNT; i++) {
      snowParticles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: 0.8 + Math.random() * 1.5,
        speed: 0.5 + Math.random() * 1.5, 
        swing: Math.random() * Math.PI * 2
      });
    }
  }

  function pointerDown(e) {
    dragging = true;
    lastX = e.clientX || e.touches[0].clientX;
  }

  function pointerMove(e) {
    if (!dragging) return;
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    if (clientX === undefined) return;
    
    const dx = clientX - lastX;
    lastX = clientX;
    
    // 只需修改旋转角度
    angleY += dx * 0.02; 
  }

  function pointerUp() { dragging = false; }

  canvas.addEventListener('pointerdown', pointerDown);
  window.addEventListener('pointermove', pointerMove);
  window.addEventListener('pointerup', pointerUp);
  window.addEventListener('pointercancel', pointerUp);

  // 滚轮缩放
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    targetScale *= e.deltaY > 0 ? 0.9 : 1.1;
    targetScale = Math.max(0.5, Math.min(2.5, targetScale));
  }, { passive: false });

  // 双指缩放
  let pinchDist = null;
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      dragging = false;
      pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    } else if (e.touches.length === 1) {
      dragging = true;
      lastX = e.touches[0].clientX;
    }
  }, { passive: true });
  
  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinchDist) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      targetScale *= d / pinchDist;
      targetScale = Math.max(0.5, Math.min(2.5, targetScale));
      pinchDist = d;
    } else if (e.touches.length === 1 && dragging) {
      const dx = e.touches[0].clientX - lastX;
      lastX = e.touches[0].clientX;
      angleY += dx * 0.02;
    }
  }, { passive: true });
  
  canvas.addEventListener('touchend', () => { 
    dragging = false;
    pinchDist = null; 
  }, { passive: true });

  let time = 0;

  function frame(ts) {
    time = ts * 0.001;
    
    // 自动缓慢旋转
    if (!dragging) angleY += speedY;
    // 缩放平滑过渡
    scale += (targetScale - scale) * 0.1;

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    const cosY = Math.cos(angleY);
    const sinY = Math.sin(angleY);
    const centerY = H * 0.55;

    // --- 画底部星云 ---
    for (const p of groundParticles) {
      // 2D 旋转投影
      const x = p.localX * cosY - p.localZ * sinY;
      const z = p.localX * sinY + p.localZ * cosY;
      
      // 近大远小
      const persp = (z + 2000) / 2000; 
      const finalX = W / 2 + x * scale;
      const finalY = centerY + (p.localY - centerY) * scale;

      const twinkle = 0.5 + 0.5 * Math.sin(time * p.twinkleSpeed + p.phase);
      
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.alpha * twinkle;
      ctx.beginPath();
      ctx.arc(finalX, finalY, p.size * scale, 0, Math.PI * 2);
      ctx.fill();
    }

    // --- 画树身 ---
    for (const p of treeParticles) {
      const x = p.localX * cosY - p.localZ * sinY;
      const z = p.localX * sinY + p.localZ * cosY;
      
      const persp = (z + 2000) / 2000; 
      const finalX = W / 2 + x * scale;
      const finalY = centerY + (p.localY - centerY) * scale;

      const twinkle = 0.6 + 0.4 * Math.sin(time * p.twinkleSpeed + p.phase);
      const alpha = p.alpha * twinkle * persp;

      // 高光粒子光晕
      if (p.color === '#ffffff') {
        const grad = ctx.createRadialGradient(finalX, finalY, 0, finalX, finalY, p.size * 3 * scale);
        grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
        grad.addColorStop(1, `rgba(255,255,255,0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(finalX, finalY, p.size * 3 * scale, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = p.color;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(finalX, finalY, p.size * scale, 0, Math.PI * 2);
      ctx.fill();
    }

    // --- 画树顶星星 ---
    {
      const starY = H * 0.8 - H * 0.5 - (H * 0.05); // 估算顶部位置
      const finalY = centerY + (starY - centerY) * scale;
      const finalX = W / 2;
      
      const pulse = 0.8 + 0.2 * Math.sin(time * 3);
      const size = 6 * pulse * scale;
      
      const grad = ctx.createRadialGradient(finalX, finalY, 0, finalX, finalY, size * 4);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.2, 'rgba(255,182,193,0.6)');
      grad.addColorStop(1, 'rgba(255,105,180,0)');
      
      ctx.fillStyle = grad;
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(finalX, finalY, size * 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = `rgba(255,255,255,${pulse})`;
      ctx.lineWidth = 1.5 * scale;
      ctx.beginPath();
      ctx.moveTo(finalX - size * 2.5, finalY);
      ctx.lineTo(finalX + size * 2.5, finalY);
      ctx.moveTo(finalX, finalY - size * 2.5);
      ctx.lineTo(finalX, finalY + size * 2.5);
      ctx.stroke();
    }

    // --- 画飘雪 ---
    ctx.fillStyle = '#ffffff';
    for (const s of snowParticles) {
      s.y += s.speed; 
      s.swing += 0.02;
      
      if (s.y > H) { 
        s.y = -10; 
        s.x = Math.random() * W; 
      }
      
      ctx.globalAlpha = s.size * 0.3;
      ctx.beginPath();
      ctx.arc(s.x + Math.sin(s.swing) * 20, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
